[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapez-harness"
version = "0.1.0"
description = "Agent harness for shapez.io: decoded savegame observation, trusted-input actuation, milestone scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.40", "lzstring>=1.0.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shapez-harness = "harness:main"

[tool.setuptools]
py-modules = ["harness", "shapez_save"]
